name: Standalone package freshness

on:
  push:
    paths:
      - 'AsymptoticInverse/Kernel/**'
      - 'AsymptoticInverse.wl'
      - 'Load.wl'
      - 'validation/build_standalone.py'
      - 'validation/test_standalone.py'
      - '.github/workflows/standalone.yml'
  pull_request:
    paths:
      - 'AsymptoticInverse/Kernel/**'
      - 'AsymptoticInverse.wl'
      - 'Load.wl'
      - 'validation/build_standalone.py'
      - 'validation/test_standalone.py'
      - '.github/workflows/standalone.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python validation/build_standalone.py --check
      - run: python -m unittest discover -s validation -p test_standalone.py -v
