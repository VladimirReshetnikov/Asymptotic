name: Mathics compatibility

on:
  push:
    branches: [main]
    paths:
      - 'src/Kernel/**'
      - 'AsymptoticAnalysis.wl'
      - 'validation/*mathics*'
      - 'validation/MathicsTests.wl'
      - '.github/workflows/mathics.yml'
  pull_request:
    paths:
      - 'src/Kernel/**'
      - 'AsymptoticAnalysis.wl'
      - 'validation/*mathics*'
      - 'validation/MathicsTests.wl'
      - '.github/workflows/mathics.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mathics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        entry: [modular, standalone]
        suite: [foundation, calculus, contracts, special]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: validation/requirements-mathics.txt
      - run: python -m pip install -r validation/requirements-mathics.txt
      - run: python validation/build_standalone.py --check
      - run: python -m unittest discover -s validation -p 'test_*mathics*.py'
      - name: Run exact portable regressions
        shell: bash
        run: |
          source=src/Kernel/AsymptoticAnalysis.wl
          if [[ '${{ matrix.entry }}' == standalone ]]; then
            source=AsymptoticAnalysis.wl
          fi
          case '${{ matrix.suite }}' in
            foundation) groups=(loading primitive assumptions) ;;
            calculus) groups=(forward inverse arithmetic) ;;
            contracts) groups=(callable contracts native flat certificate numerical logarithmic) ;;
            special) groups=(special families) ;;
          esac
          arguments=()
          for group in "${groups[@]}"; do arguments+=(--group "$group"); done
          python validation/run_mathics_tests.py --source "$source" \
            --timeout 300 --output mathics-results.json "${arguments[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathics-${{ matrix.entry }}-${{ matrix.suite }}
          path: mathics-results.json
          if-no-files-found: warn
